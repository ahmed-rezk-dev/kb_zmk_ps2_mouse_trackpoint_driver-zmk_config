manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: urob
      url-base: https://github.com/urob
    - name: badjeff
      url-base: https://github.com/badjeff

  projects:

    #
    # ZMK fork
    # Choose ONE of these options:
    #
    # Option 1: Official ZMK v0.2 (stable but may need mouse PR)
    # - name: zmk
    #   remote: zmkfirmware
    #   revision: v0.2
    #   import: app/west.yml

    # Option 2: petejohanson fork with latest mouse PR (recommended)
    - name: zmk
      remote: petejohanson
      revision: feat/pointers-move-scroll
      import: app/west.yml

    # Option 3: infused-kim fork (known compatible with PS/2 module)
    # - name: zmk
    #   remote: infused-kim
    #   revision: pr-testing/mouse_ps2_module_base
    #   import: app/west.yml

    # Option 4: urob fork with extras (may have incompatibilities)
    # - name: zmk
    #   remote: urob
    #   revision: main
    #   import: app/west.yml

    #
    # Additional modules
    #

    # PS/2 mouse & TrackPoint driver (from badjeff)
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: badjeff
      revision: main

    # ZMK helpers
    - name: zmk-helpers
      remote: urob
      revision: v0.2

  self:
    path: config
