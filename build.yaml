# This file generates the GitHub Actions matrix.
#
# Build configurations:
# - corne_tp_left/right: Standard Corne with PS/2 TrackPoint support
# - Alternative pins build: Uses high-frequency pins D1/D0 instead of D16/D10
# - settings_reset: For wiping BLE pairings
#
---
include:
  # Corne TP with TrackPoint
  - board: nice_nano_v2
    shield: corne_tp_left
  - board: nice_nano_v2
    shield: corne_tp_right

  # Alternative PINs firmware (high frequency pins)
  # Uses D1 (SCL), D0 (SDA) - compatible with keyboards without underglow
  - board: nice_nano_v2
    shield: corne_tp_right
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DMOUSE_PS2_ALT_PINS
    artifact-name: corne_tp_right-alt-pins

  # Settings Reset firmware
  # Wipes all settings - useful for Bluetooth pairing issues
  - board: nice_nano_v2
    shield: settings_reset
